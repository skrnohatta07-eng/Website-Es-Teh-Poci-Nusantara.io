<!-- LOKASI -->
<section class="section" id="lokasi">
  <div class="wrap">
    <div class="section-head">
      <div>
        <h2>Lokasi</h2>
        <p>Datang langsung, atau buka petunjuk arah dari perangkatmu. <span class="status" data-status></span></p>
      </div>
    </div>
    <div class="loc">
      <div>
        <dl>
          <div><dt>Alamat</dt><dd id="locAddr"></dd></div>
          <div id="locLandmarkRow"><dt>Patokan</dt><dd id="locLandmark"></dd></div>
          <div><dt>Jam buka</dt><dd id="locHours"></dd></div>
          <div><dt>WhatsApp</dt><dd><a id="locWa" href="#lokasi" target="_blank" rel="noopener"></a></dd></div>
        </dl>
        <div class="loc-actions">
          <a class="btn" id="mapLink" href="#lokasi" target="_blank" rel="noopener">Buka di Google Maps</a>
          <a class="btn ghost" id="dirLink" href="#lokasi" target="_blank" rel="noopener">Petunjuk arah</a>
          <button class="btn ghost" id="copyAddr" type="button">Salin alamat</button>
        </div>
      </div>
      <div>
        <div class="map">

</svg>
          <div class="map-label" data-shop-name>Es Teh Poci Nusantara</div>
        </div>
        <p class="map-note">Ilustrasi peta bergaya Maps. Gunakan tombol di samping untuk membuka peta dan rute sebenarnya.</p>
