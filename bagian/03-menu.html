<!-- MENU -->
<section class="section band" id="menu">
  <div class="wrap">
    <div class="section-head">
      <div>
        <h2>Menu es teh</h2>
        <p>Sudah diracik dan siap dipesan. Ingin mengubahnya? Tekan Ubah, atur di peracik, lalu tambahkan.</p>
      </div>
      <div class="filters" role="group" aria-label="Filter menu">
        <button type="button" data-filter="semua" aria-pressed="true">Semua</button>
        <button type="button" data-filter="klasik" aria-pressed="false">Klasik</button>
        <button type="button" data-filter="buah" aria-pressed="false">Buah</button>
        <button type="button" data-filter="creamy" aria-pressed="false">Creamy</button>
        <button type="button" data-filter="favorit" aria-pressed="false">Favorit <span id="favCount">0</span></button>
      </div>
    </div>
    <ul class="menu-list" id="menuList"></ul>
    <p class="empty" id="menuEmpty" hidden>Belum ada favorit. Tekan ikon hati di menu untuk menyimpannya.</p>
  </div>
</section>
