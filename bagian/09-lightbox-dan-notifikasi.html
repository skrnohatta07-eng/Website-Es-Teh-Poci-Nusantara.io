<dialog id="lightbox" class="lightbox" aria-label="Foto galeri">
  <div class="lb-media" id="lbMedia"></div>
  <div class="lb-bar">
    <button type="button" class="lb-btn" id="lbPrev" aria-label="Foto sebelumnya">&#8249;</button>
    <p class="lb-cap" id="lbCap"></p>
    <button type="button" class="lb-btn" id="lbNext" aria-label="Foto berikutnya">&#8250;</button>
    <button type="button" class="lb-btn" id="lbClose" aria-label="Tutup foto">&#215;</button>
  </div>
</dialog>

<div class="toast-wrap"><div class="toast" id="toast" role="status"></div></div>
